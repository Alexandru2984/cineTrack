name: cinetrack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    security_opt:
      - no-new-privileges:true
    # The backend and frontend already run with every capability dropped; this
    # was the one container still holding all of them, and it is the one with
    # the data in it.
    #
    # Postgres cannot start from nothing: its entrypoint chowns the data
    # directory and the socket directory, then drops from root to `postgres`.
    # That needs CHOWN, FOWNER and DAC_OVERRIDE for the permissions and
    # SETUID/SETGID for the switch — and nothing else. Verified against this
    # exact image before committing: with these five it is ready in four
    # seconds and serves queries; with none it fails at
    # `chmod: /var/lib/postgresql/data: Operation not permitted`.
    #
    # The database publishes no port and sits on an internal network, so this
    # is not about reaching it from outside. It narrows what an attacker who
    # already has code execution inside the container can do with it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    # `pg_stat_statements` records what every query actually costs in real
    # traffic. Without it the only visibility is a benchmark of fourteen
    # hand-picked queries against seeded data — which is how a hot path reached
    # thirteen seconds in production while every check reported healthy.
    #
    # It has to be preloaded at start-up; there is no way to switch it on later
    # without a restart. `track = top` records statements as the application
    # issues them rather than every nested call, which is the level a person
    # reading the list can act on.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      # Utility statements are stored verbatim — only ordinary queries get their
      # literals replaced by placeholders. `provision_db_role.sh` runs
      # `ALTER ROLE ... PASSWORD '...'` on every deploy, so leaving this on put
      # the database passwords in clear text in a view any role with access can
      # read. Off also removes GRANT and CREATE EXTENSION noise from a report
      # meant for application queries.
      - -c
      - pg_stat_statements.track_utility=off
      # Sized against the database rather than left at the default 128 MB.
      #
      # `catalog_external_ids` alone is 620 MB — sixty per cent of a 1019 MB
      # database — so at 128 MB the table the discovery query sorts by
      # popularity could never stay resident. Measured on production: that query
      # runs in 232-268 ms warm and averages 1003 ms in `pg_stat_statements`,
      # and the gap is disk: 4067 blocks read on a cold execution.
      #
      # 512 MB against the 2 GiB limit below leaves room for `work_mem` across
      # every connection (4 MB x 100) plus maintenance work, and a probe with
      # exactly these settings starts clean and idles at 43 MiB.
      - -c
      - shared_buffers=512MB
      # What the planner believes the operating system is caching, and it was
      # wrong in a way that mattered: 4 GB, on a container capped at 1 GiB. The
      # planner was told there was four times more cache than the container
      # could ever hold, which makes repeated index probes look cheaper than
      # they are — the shape behind more than one slow query found this week.
      # 1536 MB is honest against a 2 GiB limit.
      - -c
      - effective_cache_size=1536MB
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # 1024M for a 1019 MB database meant the whole thing could not be
          # cached even in principle, and every eviction became a disk read
          # against a 620 MB table. The host carries 60 GB with 36 GB free, so
          # the ceiling was the only thing making this tight.
          memory: 2048M
          cpus: "1.0"
          pids: 256

  backend:
    image: cinetrack-backend
    # FQDN so outbound mail (lettre Message-ID + SMTP EHLO) doesn't carry a
    # random container id — Gmail scores that as a spam signal.
    hostname: vazute.micutu.com
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        # Stamps the image with the commit it came from, so the drift check can
        # tell a current deployment from one left behind. Defaults to `unknown`,
        # which the check reports rather than silently treating as up to date.
        GIT_REVISION: "${GIT_REVISION:-unknown}"
    environment:
      APP_ENV: production
      APP_HOST: "${APP_HOST:-0.0.0.0}"
      APP_PORT: "${APP_PORT:-8080}"
      FRONTEND_URL: "${FRONTEND_URL}"
      DATABASE_URL: "${APP_DATABASE_URL:?APP_DATABASE_URL must be set}"
      JWT_SECRET: "${JWT_SECRET}"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set}"
      JWT_EXPIRY_MINUTES: "${JWT_EXPIRY_MINUTES:-15}"
      JWT_REFRESH_EXPIRY_DAYS: "${JWT_REFRESH_EXPIRY_DAYS:-30}"
      TMDB_API_KEY: "${TMDB_API_KEY}"
      TMDB_READ_ACCESS_TOKEN: "${TMDB_READ_ACCESS_TOKEN:-}"
      TMDB_BASE_URL: "${TMDB_BASE_URL:-https://api.themoviedb.org/3}"
      TMDB_IMAGE_BASE_URL: "${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}"
      TMDB_TIMEOUT_SECONDS: "${TMDB_TIMEOUT_SECONDS:-10}"
      CATALOG_HYDRATION_DAILY_BUDGET: "${CATALOG_HYDRATION_DAILY_BUDGET:-200}"
      CATALOG_HYDRATION_DELAY_MS: "${CATALOG_HYDRATION_DELAY_MS:-250}"
      RELEASE_SCHEDULE_SYNC_BUDGET: "${RELEASE_SCHEDULE_SYNC_BUDGET:-200}"
      RELEASE_SCHEDULE_SYNC_DELAY_MS: "${RELEASE_SCHEDULE_SYNC_DELAY_MS:-250}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      RATE_LIMIT_REQUESTS_PER_SECOND: "${RATE_LIMIT_REQUESTS_PER_SECOND:-10}"
      RATE_LIMIT_BURST_SIZE: "${RATE_LIMIT_BURST_SIZE:-50}"
      # Who may state a client's address on its behalf. One address: the gateway
      # of this project's own bridge, which is where nginx's traffic arrives
      # from after Docker forwards the published loopback port.
      #
      # It has to be exact. This host serves about seventy sites, and Docker
      # publishes the backend with a rule that accepts cross-bridge traffic to
      # its port ahead of the isolation DROP — so a neighbouring container can
      # reach the application directly and claim to be any client it likes.
      # Trusting "anything RFC1918" trusted every one of those neighbours.
      #
      # Confirm after a change with `docker network inspect
      # cinetrack_backend_egress`; the backend logs the rule it ended up with on
      # every start, and `--check-config` refuses a value it cannot parse before
      # a deployment swaps anything over.
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-172.26.0.1}"
      BREACHED_PASSWORD_CHECK: "${BREACHED_PASSWORD_CHECK:-true}"
      # Required in production: /metrics is on this container's own port, which
      # is published on 127.0.0.1 next to unrelated services. `:?` so a missing
      # value fails the deploy loudly instead of starting an open endpoint.
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-CineTrack <noreply@localhost>}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-15}"
      EXPO_PUSH_ACCESS_TOKEN: "${EXPO_PUSH_ACCESS_TOKEN:-}"
      EXPO_PUSH_TIMEOUT_SECONDS: "${EXPO_PUSH_TIMEOUT_SECONDS:-15}"
      R2_S3_API: "${R2_S3_API:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL:-}"
      # actix_web_prom is silenced to error on purpose. Its only log statement
      # warns that it could not interpolate a parameterised route pattern, which
      # happens on every request the rate limiter rejects: the governor answers
      # 429 before the path params are extracted, so the params map is empty.
      # The crate then falls back to the raw pattern, which is the correct label
      # anyway, so the line is noise — and without this it fires once per
      # throttled image request. Note that env_logger matches by prefix, so
      # `actix_web=info` alone would re-enable it.
      RUST_LOG: "${RUST_LOG:-cinetrack=info,actix_web=info,actix_web_prom=error}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      # Database traffic never shares an egress-capable network. Metrics are
      # scraped over a separate internal network that does not expose Postgres.
      - database
      - backend_egress
      - metrics
    healthcheck:
      test: ["CMD", "/usr/local/bin/cinetrack", "--healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256

  migrate:
    profiles: ["ops"]
    image: cinetrack-backend
    command: ["/usr/local/bin/cinetrack", "--migrate"]
    environment:
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must be set}"
      RUST_LOG: "${RUST_LOG:-cinetrack=info}"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    restart: "no"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Same default as the backend: an image built without it reports
        # `unknown` rather than silently passing as current.
        GIT_REVISION: "${GIT_REVISION:-unknown}"
        VITE_API_URL: ${VITE_API_URL}
        VITE_USE_R2_IMAGES: "${VITE_USE_R2_IMAGES:-false}"
    read_only: true
    tmpfs:
      # Writable by the non-root nginx user (uid 101); the tmpfs overlays the
      # image dirs, so it must be created writable or nginx can't make its
      # client_temp/pid on startup.
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev,uid=101,gid=101
      - /var/run:size=8m,noexec,nosuid,nodev,uid=101,gid=101
      - /tmp:size=32m,noexec,nosuid,nodev,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging
    ports:
      - "127.0.0.1:8091:8080"
    networks:
      # Isolated from every application/data network. This network remains
      # bridge-routable because Docker does not publish the loopback port from
      # an `internal: true` network on this host.
      - frontend_isolated
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
          pids: 128

networks:
  database:
    internal: true
  backend_egress:
  # Shared only with Prometheus from docker-compose.monitoring.yml.
  metrics:
    name: cinetrack_metrics
    internal: true
  frontend_isolated:

volumes:
  postgres_data:
