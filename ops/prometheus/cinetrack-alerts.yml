groups:
  - name: cinetrack-backups
    rules:
      - alert: CineTrackBackupMetricsMissing
        expr: absent(cinetrack_backup_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: CineTrack backup metrics are missing
          description: Install the backup textfile metric in the node exporter collector directory.

      - alert: CineTrackBackupFailed
        expr: cinetrack_backup_last_run_success == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: CineTrack database backup failed
          description: The most recent CineTrack backup run did not complete successfully.

      - alert: CineTrackBackupStale
        expr: time() - cinetrack_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: CineTrack database backup is stale
          description: No successful CineTrack database backup has completed in the last 26 hours.

      # The run itself still succeeds when only the off-site copy fails, since
      # R2 holds a verified archive — so nothing else here would fire. Without
      # this rule the mirror could stop for weeks and only a log nobody reads
      # would say so.
      - alert: CineTrackBackupOffsiteMirrorFailing
        expr: cinetrack_backup_offsite_wanted == 1 and cinetrack_backup_offsite_mirrored == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: CineTrack off-site backup mirror is failing
          description: >-
            Backups reach R2 but no longer reach the off-site remote, so every
            copy now depends on one provider. Check rclone credentials and that
            BACKUP_GDRIVE_REMOTE is still reachable.

      - alert: CineTrackBackupUnencrypted
        expr: cinetrack_backup_encrypted == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: CineTrack backup is not encrypted client-side
          description: Configure BACKUP_AGE_RECIPIENT and require encrypted backups.

      - alert: CineTrackBackupUsesSharedCredentials
        expr: cinetrack_backup_dedicated_credentials == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: CineTrack backup uses application R2 credentials
          description: Configure a least-privilege BACKUP_R2 credential set.

      # Releases are run by hand on purpose — no CI job can reach this host, so
      # a compromised build action cannot reach production either. The cost is
      # that forgetting to deploy is invisible, and it already cost two days of
      # backend fixes sitting on main while production ran without them. Twelve
      # hours is long enough that a same-day release never trips this.
      # Fires per artifact. The backend image, the frontend image and the host
      # nginx vhost are deployed separately, so "production is behind" without
      # saying which one sends somebody to redeploy everything to find out.
      - alert: CineTrackProductionBehindMain
        expr: cinetrack_deploy_pending_commits{artifact!=""} > 0
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: CineTrack {{ $labels.artifact }} is behind main by {{ $value }} deployable commit(s)
          description: Run the release in docs/release-process.md for that artifact, or confirm the change is not meant to ship.

      # Without the label the drift check cannot tell current from stale, and
      # would otherwise report zero — the same silence this is meant to end.
      - alert: CineTrackDeployRevisionUnknown
        expr: cinetrack_deploy_revision_known{artifact!=""} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: CineTrack cannot tell which commit the {{ $labels.artifact }} image is running
          description: Deploy that image once with GIT_REVISION set so it records its source commit.

  - name: cinetrack-backend
    rules:
      - alert: CineTrackBackendDown
        expr: up{job="cinetrack-backend"} == 0 or absent(up{job="cinetrack-backend"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: CineTrack backend metrics endpoint is down
          description: Prometheus cannot scrape the loopback-only CineTrack backend.

      - alert: CineTrackHighServerErrorRate
        expr: |
          sum(rate(cinetrack_http_requests_total{status=~"5.."}[10m]))
            /
          clamp_min(sum(rate(cinetrack_http_requests_total[10m])), 0.001) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: CineTrack backend has a high 5xx rate
          description: More than 5 percent of requests returned 5xx during the last 15 minutes.

      # A saturated service can keep returning 200 while requests queue for
      # seconds. Error-rate alerts alone miss exactly that failure mode.
      - alert: CineTrackHighApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(cinetrack_http_requests_duration_seconds_bucket{endpoint!="/metrics"}[5m])
            )
          ) > 0.5
          and
          sum(rate(cinetrack_http_requests_duration_seconds_count{endpoint!="/metrics"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CineTrack API latency is above budget
          description: The API p95 has exceeded 500 ms for ten minutes while serving more than one request per second.

      - alert: CineTrackTransactionalEmailErrors
        expr: increase(cinetrack_email_send_total{outcome=~"smtp_error|invalid_message|not_configured"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: CineTrack transactional email failed
          description: At least one transactional email failed in the last 15 minutes.

      - alert: CineTrackFatalMobileCrash
        expr: increase(cinetrack_client_error_reports_total{fatal="true"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Văzute received a fatal mobile crash report
          description: At least one authenticated Android or iOS client reported a fatal JavaScript crash in the last 15 minutes.

  - name: cinetrack-security
    rules:
      - alert: CineTrackRefreshTokenReuseDetected
        expr: increase(cinetrack_security_events_total{event="refresh_token_reuse"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Văzute detected refresh-token reuse
          description: A consumed refresh token was presented again. All sessions for the affected account were revoked automatically; follow the account-takeover runbook.

      - alert: CineTrackRecoveryCodeUsed
        expr: increase(cinetrack_security_events_total{event="recovery_code_used"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A Văzute two-factor recovery code was used
          description: Recovery-code use can be legitimate, but it is also a strong account-recovery signal that should be reviewed promptly.

      - alert: CineTrackLoginRejectionSpike
        expr: increase(cinetrack_security_events_total{event="login_rejected"}[5m]) > 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Văzute is rejecting an unusual number of sign-ins
          description: More than 20 password or two-factor sign-ins were rejected in five minutes, consistent with credential stuffing or brute force.

      - alert: CineTrackAccountLocked
        expr: increase(cinetrack_security_events_total{event="account_locked"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A Văzute account was locked after failed sign-ins
          description: The failed-sign-in threshold was reached. Review nearby authentication events for attempted account takeover.

      - alert: CineTrackSensitiveAccountActivitySpike
        expr: |
          sum(increase(cinetrack_security_events_total{
            event=~"account_data_exported|account_deleted|credential_changed"
          }[15m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Văzute has unusual sensitive account activity
          description: More than five credential changes, account exports, or account deletions completed in fifteen minutes.

      - alert: CineTrackScriptCspViolationSpike
        expr: |
          sum(increase(cinetrack_csp_reports_total{
            directive=~"script-src.*",disposition="enforce"
          }[15m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Văzute is blocking an unusual number of scripts
          description: More than five enforced script CSP violations arrived in fifteen minutes. Check for a broken release or attempted script injection.

  - name: cinetrack-community-safety
    rules:
      - alert: CineTrackModerationMetricsMissing
        expr: absent(cinetrack_moderation_queue_reports{status="open"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Văzute moderation metrics are missing
          description: The backend is not publishing moderation queue state. Check the backend metrics target and database connectivity.

      - alert: CineTrackChildSafetyReportReceived
        expr: increase(cinetrack_safety_reports_total{reason="child_safety"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Văzute received a child-safety report
          description: Triage the priority moderation queue immediately and follow the child-safety escalation steps in the moderation runbook.

      - alert: CineTrackThreatReportReceived
        expr: increase(cinetrack_safety_reports_total{reason="threatening"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Văzute received a threat or violence report
          description: Review the priority moderation queue promptly and assess immediate-danger escalation.

      - alert: CineTrackSafetyReportSpike
        expr: sum(increase(cinetrack_safety_reports_total[15m])) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Văzute is receiving an unusual number of safety reports
          description: More than thirty reports arrived in fifteen minutes. Check for a real incident, coordinated abuse, or automation.

      - alert: CineTrackModerationQueueGrowing
        expr: sum(cinetrack_moderation_queue_reports{status=~"open|reviewing"}) > 25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Văzute moderation queue is growing
          description: More than twenty-five active reports have remained in the moderation queue for thirty minutes.

      - alert: CineTrackModerationReportStale
        expr: cinetrack_moderation_oldest_active_age_seconds > 43200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A Văzute safety report is stale
          description: The oldest open or reviewing report is more than twelve hours old. Review the queue and document the delay.

  - name: cinetrack-auto-deploy
    rules:
      # The state that cannot be left alone: a deploy failed and the previous
      # image could not be put back, because the revision had already migrated
      # the schema. Production is running something known to be broken and only
      # a person can decide what happens next.
      - alert: CineTrackAutoDeployStuck
        expr: cinetrack_auto_deploy_state{state="stuck"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Văzute auto-deploy failed and could not roll back
          description: A deployment left production unhealthy and no rollback was available. Check scripts/auto_deploy.sh output and deploy by hand.

      # Recovered on its own, so not a page — but somebody still merged
      # something that took production down, and that should not pass unnoticed
      # just because the machine cleaned it up.
      - alert: CineTrackAutoDeployRolledBack
        expr: cinetrack_auto_deploy_state{state="rolled_back"} == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Văzute auto-deploy rolled back a bad revision
          description: A revision passed CI, failed its health check in production, and was automatically reverted to the previous images.

      # The release is fine and the containers are answering; the path from the
      # public name to them is not. No image swap fixes that, so this reports
      # rather than reverting a good deploy.
      - alert: CineTrackAutoDeployEdgeUnhealthy
        expr: cinetrack_auto_deploy_state{state="edge_unhealthy"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Văzute containers are healthy but the public URL is not
          description: A deploy succeeded and both containers answer locally, but https://vazute.micutu.com/api/health does not. Check nginx and Cloudflare, not the release.

      # Needs a person: the images cannot ship until the vhost is installed by
      # hand, so this state does not clear itself.
      - alert: CineTrackAutoDeployNeedsVhost
        expr: cinetrack_auto_deploy_state{state="blocked_nginx"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Văzute auto-deploy is waiting on an nginx vhost change
          description: The pending revision changes nginx/vazute.micutu.com.conf, which is installed by hand. Deploy this revision manually.

      # `main` has been red for hours. Auto-deploy is correctly refusing it, so
      # nothing is broken in production — but nothing can ship either.
      - alert: CineTrackAutoDeployBlockedByCI
        expr: cinetrack_auto_deploy_state{state="blocked_ci"} == 1
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: Văzute cannot deploy because CI is failing on main
          description: The newest commit on main has failing checks, so nothing has been deployed since it landed.

      # GitHub cannot be asked whether a commit passed. The anonymous API is
      # rate limited to 60 requests an hour per address, and this shares that
      # budget with anything else on the host that talks to GitHub.
      - alert: CineTrackAutoDeployApiUnreadable
        expr: cinetrack_auto_deploy_state{state="blocked_api"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Văzute auto-deploy cannot read CI results from GitHub
          description: The anonymous GitHub API has been unreadable for an hour — most likely the 60/hour rate limit shared with other tooling on this host. Nothing is being deployed.

      # A commit that has been "waiting for CI" for hours is not waiting, it is
      # stuck — a workflow that never reports leaves this state indefinitely,
      # and a permanent `waiting_ci` is indistinguishable from a busy one
      # without a clock on it. CI takes about half an hour.
      - alert: CineTrackAutoDeployWaitingTooLong
        expr: cinetrack_auto_deploy_state{state="waiting_ci"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Văzute auto-deploy has been waiting on CI for two hours
          description: The newest commit on main has checks that never completed. Look for a hung or never-started workflow; nothing has deployed since it landed.

      # The cron entry stopped running. Without this the whole mechanism can
      # disappear and the only symptom is that deploys quietly stop happening —
      # the exact silence the drift check was added to end.
      - alert: CineTrackAutoDeployNotRunning
        expr: absent(cinetrack_auto_deploy_run_timestamp_seconds) or time() - cinetrack_auto_deploy_run_timestamp_seconds > 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Văzute auto-deploy has stopped running
          description: No auto-deploy run has reported in over an hour. Check the cron entry and its log.

  - name: cinetrack-releases
    rules:
      - alert: CineTrackReleaseWorkerMetricsMissing
        expr: absent(cinetrack_release_worker_last_run_timestamp_seconds)
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: Văzute release worker metrics are missing
          description: The release worker has not published textfile metrics to node exporter.

      - alert: CineTrackReleaseWorkerFailed
        expr: cinetrack_release_worker_last_run_success == 0
        # The worker runs hourly. Wait past the next scheduled run so one
        # transient provider failure does not page as a critical incident.
        for: 65m
        labels:
          severity: critical
        annotations:
          summary: Văzute release worker failed
          description: The release worker has remained unsuccessful across two scheduled hourly runs.

      - alert: CineTrackReleaseWorkerStale
        expr: time() - cinetrack_release_worker_last_success_timestamp_seconds > 10800
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Văzute release worker is stale
          description: No release schedule synchronization has completed successfully in the last three hours.

      - alert: CineTrackReleaseWorkerDatabaseMetricsInvalid
        expr: cinetrack_release_worker_database_metrics_valid == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Văzute release health metrics are incomplete
          description: The worker ran but could not query schedule and push delivery health from PostgreSQL.

      - alert: CineTrackReleaseScheduleStale
        expr: cinetrack_release_schedule_stale_active_titles > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Văzute has stale active TV schedules
          description: At least one active tracked TV title has not refreshed successfully in the last 12 hours.

      - alert: CineTrackReleaseScheduleRepeatedFailures
        expr: cinetrack_release_schedule_repeated_failures > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Văzute release schedules are repeatedly failing
          description: At least one tracked title has accumulated three consecutive schedule refresh failures.

      - alert: CineTrackPushDeliveryFailed
        expr: cinetrack_release_push_failed_last_run > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Văzute release push delivery failed
          description: At least one push notification became a terminal failure during the latest worker run.

      - alert: CineTrackPushDeliveryOverdue
        expr: cinetrack_release_push_overdue_deliveries > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Văzute release push deliveries are overdue
          description: A push delivery has remained due for submission or receipt processing beyond its allowed window.
