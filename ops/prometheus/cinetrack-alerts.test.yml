# Unit tests for the alert rules: `promtool test rules` replays these series and
# checks which alerts fire. `promtool check rules` only proves the file parses;
# this proves a rule fires on the values it was written for, and stays quiet on
# a healthy system.
rule_files:
  - cinetrack-alerts.yml

evaluation_interval: 1m

tests:
  - name: a failed restore drill pages
    interval: 1m
    input_series:
      - series: cinetrack_restore_drill_success
        values: "0x30"
      - series: cinetrack_restore_drill_timestamp_seconds
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: CineTrackRestoreDrillFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: CineTrack backup restore drill failed
              description: >-
                The latest backup could not be restored into a scratch database, so
                the backups are not known to be usable. Run
                scripts/backup_restore_drill.sh by hand and read its output.

  - name: a drill that stopped running goes stale after eight days
    # Scraped every five minutes, inside the default five-minute lookback, so
    # the series stays present between samples as it does in production.
    interval: 5m
    input_series:
      # The last drill started at t=0 and none has run since.
      - series: cinetrack_restore_drill_timestamp_seconds
        values: "0x3000"
      - series: cinetrack_restore_drill_success
        values: "1x3000"
    alert_rule_test:
      - eval_time: 7d
        alertname: CineTrackRestoreDrillStale
        exp_alerts: []
      - eval_time: 9d
        alertname: CineTrackRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: CineTrack backup restore drill has not run for over a week
              description: >-
                No restore drill has started in eight days. Check that the weekly
                cron entry for scripts/backup_restore_drill.sh is still installed.
      - eval_time: 9d
        alertname: CineTrackRestoreDrillFailed
        exp_alerts: []

  - name: missing drill metrics are reported
    interval: 1m
    input_series:
      - series: cinetrack_backup_last_run_timestamp_seconds
        values: "0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: CineTrackRestoreDrillMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: CineTrack restore drill metrics are missing
              description: >-
                restore_drill.prom is not reaching the node exporter, so a failing
                or unscheduled drill would go unnoticed.

  - name: a failed monitoring sync warns
    interval: 1m
    input_series:
      - series: cinetrack_monitoring_sync_success
        values: "0x60"
      - series: cinetrack_monitoring_sync_timestamp_seconds
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: CineTrackMonitoringSyncFailed
        exp_alerts: []
      - eval_time: 45m
        alertname: CineTrackMonitoringSyncFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Prometheus is not running the deployed monitoring configuration
              description: >-
                auto_deploy.sh could not bring Prometheus onto the alert rules of the
                revision in production. Read the auto-deploy log for the reason: rules
                failing promtool, a rejected reload, or a container that does not
                mount the synced directory.
      # The sync ran every minute, so it is not stale.
      - eval_time: 45m
        alertname: CineTrackMonitoringSyncStale
        exp_alerts: []

  - name: a sync that stopped running goes stale after an hour
    interval: 5m
    input_series:
      - series: cinetrack_monitoring_sync_timestamp_seconds
        values: "0x40"
      - series: cinetrack_monitoring_sync_success
        values: "1x40"
    alert_rule_test:
      - eval_time: 50m
        alertname: CineTrackMonitoringSyncStale
        exp_alerts: []
      - eval_time: 90m
        alertname: CineTrackMonitoringSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The monitoring configuration sync has stopped running
              description: >-
                auto_deploy.sh syncs the monitoring configuration on every run, and
                runs every ten minutes. Nothing has synced for an hour, so either the
                cron entry is gone or the script stops before it gets there.
