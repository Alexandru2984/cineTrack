# Unit tests for the alert rules: `promtool test rules` replays these series and
# checks which alerts fire. `promtool check rules` only proves the file parses;
# this proves a rule fires on the values it was written for, and stays quiet on
# a healthy system.
rule_files:
  - cinetrack-alerts.yml

evaluation_interval: 1m

tests:
  - name: a failed restore drill pages
    interval: 1m
    input_series:
      - series: cinetrack_restore_drill_success
        values: "0x30"
      - series: cinetrack_restore_drill_timestamp_seconds
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: CineTrackRestoreDrillFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: CineTrack backup restore drill failed
              description: >-
                The latest backup could not be restored into a scratch database, so
                the backups are not known to be usable. Run
                scripts/backup_restore_drill.sh by hand and read its output.

  - name: a drill that stopped running goes stale after eight days
    # Scraped every five minutes, inside the default five-minute lookback, so
    # the series stays present between samples as it does in production.
    interval: 5m
    input_series:
      # The last drill started at t=0 and none has run since.
      - series: cinetrack_restore_drill_timestamp_seconds
        values: "0x3000"
      - series: cinetrack_restore_drill_success
        values: "1x3000"
    alert_rule_test:
      - eval_time: 7d
        alertname: CineTrackRestoreDrillStale
        exp_alerts: []
      - eval_time: 9d
        alertname: CineTrackRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: CineTrack backup restore drill has not run for over a week
              description: >-
                No restore drill has started in eight days. Check that the weekly
                cron entry for scripts/backup_restore_drill.sh is still installed.
      - eval_time: 9d
        alertname: CineTrackRestoreDrillFailed
        exp_alerts: []

  - name: missing drill metrics are reported
    interval: 1m
    input_series:
      - series: cinetrack_backup_last_run_timestamp_seconds
        values: "0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: CineTrackRestoreDrillMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: CineTrack restore drill metrics are missing
              description: >-
                restore_drill.prom is not reaching the node exporter, so a failing
                or unscheduled drill would go unnoticed.

  - name: a failed monitoring sync warns
    interval: 1m
    input_series:
      - series: cinetrack_monitoring_sync_success
        values: "0x60"
      - series: cinetrack_monitoring_sync_timestamp_seconds
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: CineTrackMonitoringSyncFailed
        exp_alerts: []
      - eval_time: 45m
        alertname: CineTrackMonitoringSyncFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Prometheus is not running the deployed monitoring configuration
              description: >-
                auto_deploy.sh could not bring Prometheus onto the alert rules of the
                revision in production. Read the auto-deploy log for the reason: rules
                failing promtool, a rejected reload, or a container that does not
                mount the synced directory.
      # The sync ran every minute, so it is not stale.
      - eval_time: 45m
        alertname: CineTrackMonitoringSyncStale
        exp_alerts: []

  - name: a sync that stopped running goes stale after an hour
    interval: 5m
    input_series:
      - series: cinetrack_monitoring_sync_timestamp_seconds
        values: "0x40"
      - series: cinetrack_monitoring_sync_success
        values: "1x40"
    alert_rule_test:
      - eval_time: 50m
        alertname: CineTrackMonitoringSyncStale
        exp_alerts: []
      - eval_time: 90m
        alertname: CineTrackMonitoringSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The monitoring configuration sync has stopped running
              description: >-
                auto_deploy.sh syncs the monitoring configuration on every run, and
                runs every ten minutes. Nothing has synced for an hour, so either the
                cron entry is gone or the script stops before it gets there.

  - name: a failed catalog sync is reported, a healthy one is not
    interval: 1m
    input_series:
      - series: cinetrack_catalog_sync_success
        values: "0x30"
      - series: cinetrack_catalog_sync_timestamp_seconds
        values: "0x30"
      - series: cinetrack_catalog_hydration_success
        values: "1x30"
      - series: cinetrack_catalog_hydration_timestamp_seconds
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: CineTrackCatalogSyncFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute TMDB catalog sync failed
              description: >-
                The daily import of TMDB's ID exports did not complete, so new titles
                stop reaching the catalog and hydration soon refuses to run. Read
                catalog.log and run scripts/sync_tmdb_catalog.py by hand.
      - eval_time: 15m
        alertname: CineTrackCatalogHydrationFailed
        exp_alerts: []

  - name: a failed catalog hydration is reported
    interval: 1m
    input_series:
      - series: cinetrack_catalog_hydration_success
        values: "0x30"
      - series: cinetrack_catalog_hydration_timestamp_seconds
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: CineTrackCatalogHydrationFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute catalog hydration failed
              description: >-
                The daily hydration of popular catalog titles did not complete. If the
                catalog sync is failing too, fix that first: hydration refuses to run
                on an inventory more than two days old. Read hydration.log.

  - name: catalog jobs that stop running are reported after thirty hours
    # Scraped every five minutes, inside the default lookback, as in production.
    interval: 5m
    input_series:
      # Both jobs last started at t=0 and succeeded; neither has run since.
      - series: cinetrack_catalog_sync_timestamp_seconds
        values: "0x600"
      - series: cinetrack_catalog_sync_success
        values: "1x600"
      - series: cinetrack_catalog_hydration_timestamp_seconds
        values: "0x600"
      - series: cinetrack_catalog_hydration_success
        values: "1x600"
    alert_rule_test:
      - eval_time: 29h
        alertname: CineTrackCatalogSyncNotRunning
        exp_alerts: []
      - eval_time: 32h
        alertname: CineTrackCatalogSyncNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute TMDB catalog sync has stopped running
              description: >-
                No catalog sync has reported in thirty hours. Check that the cron entry
                for scripts/sync_tmdb_catalog.py is still installed.
      - eval_time: 32h
        alertname: CineTrackCatalogHydrationNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute catalog hydration has stopped running
              description: >-
                No catalog hydration has reported in thirty hours. Check that the cron
                entry for scripts/hydrate_tmdb_catalog.sh is still installed.
      - eval_time: 32h
        alertname: CineTrackCatalogSyncFailed
        exp_alerts: []

  - name: a failed IndexNow submission is reported
    interval: 1m
    input_series:
      - series: cinetrack_indexnow_success
        values: "0x30"
      - series: cinetrack_indexnow_timestamp_seconds
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: CineTrackIndexNowFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute IndexNow submission failed
              description: >-
                The daily submission of new public pages to IndexNow (Bing, Yandex and
                the others) did not complete, so new titles wait for those engines to
                crawl them. Read indexnow.log and run scripts/indexnow_submit.py by hand.

  - name: a stopped IndexNow submission is reported
    interval: 1h
    input_series:
      - series: cinetrack_indexnow_success
        values: "1x40"
      - series: cinetrack_indexnow_timestamp_seconds
        values: "0x40"
    alert_rule_test:
      - eval_time: 29h
        alertname: CineTrackIndexNowNotRunning
        exp_alerts: []
      - eval_time: 32h
        alertname: CineTrackIndexNowNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute IndexNow submission has stopped running
              description: >-
                No IndexNow submission has reported in thirty hours. Check that the cron
                entry for scripts/indexnow_submit.py is still installed.
      - eval_time: 32h
        alertname: CineTrackIndexNowFailed
        exp_alerts: []

  - name: missing catalog metrics are reported
    interval: 1m
    input_series:
      - series: cinetrack_backup_last_run_timestamp_seconds
        values: "0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: CineTrackCatalogSyncNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Văzute TMDB catalog sync has stopped running
              description: >-
                No catalog sync has reported in thirty hours. Check that the cron entry
                for scripts/sync_tmdb_catalog.py is still installed.
      - eval_time: 30m
        alertname: CineTrackCatalogSyncNotRunning
        exp_alerts: []

  - name: repeated logged errors from one module are reported
    interval: 1m
    input_series:
      - series: 'cinetrack_log_events_total{level="error", target="cinetrack::services::badges"}'
        values: "0+1x60"
      - series: 'cinetrack_log_events_total{level="error", target="cinetrack::routes::media"}'
        values: "0x30 1x30"
      - series: 'cinetrack_log_events_total{level="warn", target="cinetrack::services::tmdb"}'
        values: "0+10x60"
      - series: 'cinetrack_log_events_total{level="error", target="cinetrack::mobile_client"}'
        values: "0+10x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: CineTrackBackendLoggingErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              target: cinetrack::services::badges
            exp_annotations:
              summary: "Văzute backend keeps logging errors from cinetrack::services::badges"
              description: >-
                cinetrack::services::badges logged at least three errors in the last hour. The
                request or job may have carried on, but something is failing. Read the
                backend log with docker logs cinetrack-backend-1.

