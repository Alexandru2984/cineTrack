server {
    listen 8080;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;

    # Never build a redirect out of this container's own address. The prerendered
    # public pages are directories (`/about/index.html`), so `try_files ... $uri/`
    # made nginx redirect `/about` to `/about/` — and it wrote that redirect as
    # `http://vazute.micutu.com:8080/about/`, leaking the internal port and
    # downgrading the scheme. Following it from outside goes nowhere, so the very
    # pages the prerendering exists to get indexed could not be reached.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # `$uri/index.html` before `$uri/`: serving the file directly means no
        # redirect happens at all, so the address a crawler requested is the
        # address it gets, and it matches the canonical the page declares.
        try_files $uri $uri/index.html $uri/ /index.html;
        # Cloudflare JavaScript Detections otherwise rewrites HTML with an
        # inline bootstrap that the intentionally strict edge CSP blocks.
        add_header Cache-Control "no-cache, no-transform" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /theme.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
