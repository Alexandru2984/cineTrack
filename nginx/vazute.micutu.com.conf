limit_req_zone $binary_remote_addr zone=vazute_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vazute_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=vazute_import:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=vazute_assets:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vazute_search:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=vazute_api_conn:10m;
limit_conn_zone $binary_remote_addr zone=vazute_assets_conn:10m;

# Which clients get the metadata for a shared link rather than the application.
#
# Every deep link unfurled identically — a list, a film and a profile all showed
# "Văzute — track what you watch" — because every route serves one index.html
# and none of these clients run JavaScript. They never see the page the reader
# sees, so they never saw what was shared.
#
# Matched on the crawlers that build link previews. Anything unrecognised falls
# through to the application unchanged, so being wrong here costs a preview, not
# a page.
map $http_user_agent $vazute_unfurler {
    default 0;
    "~*facebookexternalhit|facebookcatalog|Twitterbot|Slackbot|Discordbot|WhatsApp|TelegramBot|LinkedInBot|Pinterest|SkypeUriPreview|redditbot|Iframely|vkShare|Bluesky|Mastodon|Applebot" 1;
}

server {
    include snippets/block-dotfiles.conf;
    server_name vazute.micutu.com;

    server_tokens off;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    reset_timedout_connection on;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    limit_conn_status 429;

    # Defined globally from the TCP peer address, before real-IP rewriting.
    if ($from_cloudflare_origin = 0) { return 403; }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # CSP violations are POSTed to the backend sink (/api/csp-report): report-uri
    # for older browsers, Reporting-Endpoints + report-to for current ones.
    add_header Reporting-Endpoints 'csp-endpoint="https://vazute.micutu.com/api/csp-report"' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https://image.tmdb.org data:; connect-src 'self' https://analytics.micutu.com https://cloudflareinsights.com; font-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report; report-to csp-endpoint" always;

    location = /.well-known/security.txt {
        access_log off;
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:984.alexmihai@gmail.com\nExpires: 2027-07-27T23:59:59Z\nPreferred-Languages: ro, en\nCanonical: https://vazute.micutu.com/.well-known/security.txt\nPolicy: https://vazute.micutu.com/privacy\n";
    }

    location = /api/import/tvtime {
        client_max_body_size 25M;
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req zone=vazute_import burst=2 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    location = /api/users/me/avatar {
        client_max_body_size 4M;
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/auth/ {
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req zone=vazute_auth burst=10 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/img/ {
        limit_req zone=vazute_assets burst=100 nodelay;
        limit_req_status 429;
        limit_conn vazute_assets_conn 128;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/assets/ {
        limit_req zone=vazute_assets burst=100 nodelay;
        limit_req_status 429;
        limit_conn vazute_assets_conn 128;
        proxy_pass http://127.0.0.1:8090;
    }

    location = /api/media/search {
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req zone=vazute_search burst=10 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    # The feed status endpoint is the prefix of the token location below, minus
    # its trailing slash. Without this exact match nginx answers it with a 301
    # to /api/calendar/feed/, which the backend then reads as an empty feed
    # token and refuses — so the settings card could never load its state.
    # An exact match outranks every prefix, so the request is proxied as-is.
    location = /api/calendar/feed {
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    # The 64-hex path component is a bearer credential for calendar clients
    # that cannot send an Authorization header. Never persist it in nginx
    # access or error logs. Backend request metrics still cover this endpoint.
    location ^~ /api/calendar/feed/ {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    # The server-sent event stream. Long-lived by design, so the settings that
    # protect ordinary requests are exactly wrong here and have to be overridden
    # before the generic /api/ block claims the prefix.
    location = /api/events {
        # Without this nginx accumulates the response in a buffer and releases
        # it only when full, which turns every push into a delayed batch — the
        # push looks like it works, just slowly and in bursts, which is the
        # hardest version of this bug to notice.
        proxy_buffering off;
        proxy_cache off;
        # A stream that is idle is healthy. The default 30s read timeout would
        # cut it repeatedly; this sits comfortably above the backend's 25s
        # keepalive frame, so a genuinely dead upstream is still detected.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE is defined over HTTP/1.1 chunked transfer; leaving Connection to
        # default can hand the upstream a keep-alive header it did not expect.
        proxy_set_header Connection "";

        # One connection per open tab, held open. Counting those against the
        # interactive API's burst budget would let a few tabs exhaust it for
        # every other request from the same address.
        limit_conn vazute_api_conn 20;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/ {
        limit_req zone=vazute_api burst=50 nodelay;
        limit_req_status 429;
        limit_conn vazute_api_conn 20;
        proxy_pass http://127.0.0.1:8090;
    }

    # A shared link should show what was shared. Readers are untouched: only the
    # preview crawlers above are answered by the backend, and only for the three
    # kinds of page worth previewing. Visibility is decided by the backend, so a
    # private list or account returns the same generic card as a missing one.
    #
    # Each of these rewrites rather than proxying from inside the `if`. That is
    # not style. A `proxy_pass` inside `if` runs in an implicit nested location
    # which does not inherit the enclosing regex captures, so the obvious spelling
    # — `proxy_pass http://127.0.0.1:8090/unfurl/media/$1` — sends `/unfurl/media/`
    # with the id silently dropped, and `nginx -t` accepts it. Measured against a
    # throwaway nginx before this shipped. `rewrite ... last` is one of the two
    # directives nginx documents as safe inside `if`, and carries its own capture.
    location ~ "^/lists/([0-9a-fA-F-]{36})$" {
        if ($vazute_unfurler) {
            rewrite "^/lists/([0-9a-fA-F-]{36})$" /unfurl/list/$1 last;
        }
        proxy_pass http://127.0.0.1:8091;
    }

    location ~ "^/media/([0-9]+)$" {
        if ($vazute_unfurler) {
            rewrite "^/media/([0-9]+)$" /unfurl/media/$1 last;
        }
        proxy_pass http://127.0.0.1:8091;
    }

    location ~ "^/profile/([A-Za-z0-9_.-]{1,50})$" {
        if ($vazute_unfurler) {
            rewrite "^/profile/([A-Za-z0-9_.-]{1,50})$" /unfurl/profile/$1 last;
        }
        proxy_pass http://127.0.0.1:8091;
    }

    # Reachable only through the rewrites above. `internal` keeps one public
    # address per page: somebody who finds this path cannot serve the card as a
    # page of its own, which would be a second URL for the same content.
    location ^~ /unfurl/ {
        internal;
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    # No snippets/robots.conf here on purpose. That snippet serves one shared
    # file to every site on this machine, so it can only ever advertise a
    # sitemap that belongs to none of them. Falling through to the app instead
    # lets this site ship its own robots.txt next to its own sitemap, both
    # under version control. The shared file stays untouched for its other
    # twenty consumers.
    ssl_certificate /etc/letsencrypt/live/vazute.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vazute.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    include snippets/block-dotfiles.conf;
    server_name vazute.micutu.com;
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}
