# Reviewed and accepted RustSec advisories.
#
# An entry here is a claim that the vulnerable code cannot be reached in this
# deployment, not that the advisory is unimportant. Each one names the reason
# and what would invalidate it. `scripts/tests/rust_audit_exceptions_test.sh`
# checks the reasoning against the code, so an exception cannot quietly outlive
# the facts it rests on.

[advisories]
ignore = [
    # RUSTSEC-2026-0258 — h2: unbounded empty DATA frames (denial of service).
    #
    # Two versions are in the tree. h2 0.4 was updated to the patched 0.4.16.
    # h2 0.3.27 comes from actix-http, and the advisory offers no fix on the 0.3
    # line, so there is nothing to upgrade to short of actix-web 4 changing its
    # own dependency.
    #
    # It is unreachable here. actix-web serves HTTP/2 only over a TLS bind with
    # ALPN, or through an explicit h2c bind; `main.rs` uses a plain `.bind()`,
    # which serves HTTP/1.x and nothing else. In front of it, nginx sets
    # `proxy_http_version 1.1`, so the only client the backend ever has speaks
    # HTTP/1.1 too. No connection reaches the h2 codec.
    #
    # Revisit if the server ever binds TLS or h2c, if nginx starts proxying with
    # HTTP/2, or as soon as actix-http ships a release on patched h2 — whichever
    # happens first. The guard test fails on the first two.
    "RUSTSEC-2026-0258",
]

# Warnings, recorded rather than left to be rediscovered.
#
# `cargo audit` reports these without failing, so a green run has always
# tolerated them — which means nothing was written down about why, and the next
# reader had to work it out again. An audit in September 2026 raised exactly
# that: a green gate expresses an acceptance policy, not a zero-vulnerability
# inventory.
#
# RUSTSEC-2026-0253 — lru 0.16.4, unsound.
#
#   Reached through aws-sdk-s3, which uses it to cache credential resolution.
#   The unsoundness needs a `pop` whose value has a `Drop` that panics, with
#   unwinding, caught. Nothing in this tree stores such a type in an `lru`: the
#   cache holds AWS SDK credential structs, which are plain data. RustSec lists
#   the fix in >= 0.18.2, which aws-sdk-s3 1.143 does not accept; forcing it
#   would mean pinning a version its own bounds reject.
#
#   Revisit when aws-sdk-s3 widens the bound. Do not force it before then.
#
# chacha20 0.10.0 — yanked.
#
#   Reached through rand, through actix-http. Yanked is a publication status,
#   not a vulnerability: the release was withdrawn from the registry and the
#   lockfile still pins it. There is no advisory against it and nothing to fix
#   here until actix-http moves.
#
#   Revisit on the next actix-web release.
