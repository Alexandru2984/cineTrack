appId: ${APP_ID}
name: Android unauthenticated release smoke
tags:
  - smoke
  - android
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Continue tracking what you watch"
    timeout: 20000
    optional: true
- runFlow:
    # The CI emulator sometimes reports System UI as not responding, most often
    # right after it briefly drops off ADB, and the dialog covers the app: on
    # 2026-10-13 it failed main with the sign-in screen rendered underneath.
    # It is the emulator's, not the app's, so wait it out and carry on.
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible: "Continue tracking what you watch"
- assertVisible: "Sign in"
- tapOn:
    id: "auth-email"
- inputText: "not-an-email"
- hideKeyboard
- tapOn: "Sign in"
- assertVisible: "Enter a valid email address"
- tapOn: "Forgot password?"
- assertVisible: "Reset password"
- tapOn:
    id: "forgot-password-email"
- inputText: "invalid"
- hideKeyboard
- tapOn: "Send reset link"
- assertVisible: "Enter a valid email address"
- tapOn: "Back to sign in"
- tapOn:
    id: "auth-switch-mode"
- assertVisible: "Create your watch history"
- tapOn:
    id: "auth-accept-terms"
- tapOn: "Create account"
- assertVisible: "Enter a valid email address"
- openLink: "vazute://reset-password"
- assertVisible: "This reset link is missing, malformed, or no longer complete."
- tapOn: "Request a new link"
- assertVisible: "Reset password"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Continue tracking what you watch"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible: "Continue tracking what you watch"
