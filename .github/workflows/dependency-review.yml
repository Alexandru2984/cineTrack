name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          allow-licenses: >-
            0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-3-Clause, BSL-1.0, BlueOak-1.0.0, CC-BY-4.0, CC0-1.0,
            CDLA-Permissive-2.0, ISC, LGPL-2.1-or-later, LGPL-3.0-or-later,
            MIT, MIT-0, MPL-2.0, Python-2.0, Unicode-3.0, Unlicense, Zlib
          # brotli-decompressor declares "BSD-3-Clause/MIT", the slash form
          # crates.io accepted before SPDX expressions. GitHub cannot parse it
          # and reports LicenseRef-bad-bsd-3-clausemit, though both licenses
          # are on the list above. The crate comes in through actix-http's
          # compression, so any actix release that moves it would otherwise
          # be blocked on the spelling of its manifest.
          allow-dependencies-licenses: pkg:cargo/brotli-decompressor
          # GHSA-3g3m-2fjr-6pw4 (moderate): glob can keep walking the file
          # system after its AbortSignal fires. Fixed only in glob 14, and
          # @expo/fingerprint still requires 13, so any mobile lockfile change
          # that touches it re-adds a 13.x copy under it and is refused here,
          # zod's HIGH fix with it. That copy runs only in Node build tooling
          # (fingerprinting the native project for an EAS build), never in the
          # app and never with a signal anyone outside controls. Remove this
          # line once @expo/fingerprint accepts glob 14.
          allow-ghsas: GHSA-3g3m-2fjr-6pw4
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true
