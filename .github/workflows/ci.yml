name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Keep in step with the rust tag in backend/Dockerfile.{dev,prod}: CI installs
  # its own toolchain, so bumping only the image leaves this behind and the
  # build fails on crates that raised their minimum rustc.
  RUST_TOOLCHAIN: 1.97.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check the toolchain matches the container images
        run: |
          # RUST_TOOLCHAIN and the Dockerfile tags are separate knobs, so bumping
          # one alone gets caught here rather than as a compile error deep in the
          # dependency graph.
          for file in Dockerfile.dev Dockerfile.prod; do
            found=$(grep -oP '(?<=^FROM rust:)[0-9]+\.[0-9]+\.[0-9]+' "$file")
            if [ "$found" != "$RUST_TOOLCHAIN" ]; then
              echo "::error file=backend/$file::$file uses rust $found but RUST_TOOLCHAIN is $RUST_TOOLCHAIN"
              exit 1
            fi
          done
          echo "backend images and RUST_TOOLCHAIN agree on rust $RUST_TOOLCHAIN"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  integration:
    name: Backend Integration
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: cinetrack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d cinetrack_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://test_user:test_pass@localhost:5433/cinetrack_test
        run: cargo test --test api_tests -- --ignored --test-threads=1

      - name: Database query-plan regressions
        run: |
          set -euo pipefail
          postgres_container=$(docker ps --filter publish=5433 --format '{{.ID}}' | head -n 1)
          if [[ -z "$postgres_container" ]]; then
            echo "::error::PostgreSQL service container was not found"
            exit 1
          fi
          bench_user_id=$(docker exec "$postgres_container" \
            psql -U test_user -d cinetrack_test -X -q -t -A \
            -c "INSERT INTO users (username, email, email_verified) VALUES ('bench-ci', 'bench-ci@example.invalid', TRUE) RETURNING id;")
          docker exec -i "$postgres_container" \
            psql -U test_user -d cinetrack_test -X -q -v user_id="'$bench_user_id'" \
            < ../bench/db/seed_bench_data.sql
          BENCH_DB_PORT=5433 ../bench/db/explain_hot_queries.sh "$bench_user_id"

  frontend:
    name: Frontend
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Enforce bundle budgets
        run: npm run check:bundle

      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=moderate

  mobile:
    name: Mobile
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Decide whether the native build is needed
        id: native
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compiling the Android release takes ~30 minutes: it downloads the
          # SDK and NDK and builds the whole React Native native stack. A change
          # that touches neither the mobile project nor this workflow cannot
          # affect it, and dependency bots open a steady stream of exactly those
          # pull requests. Pushes to a branch always build, so main is never
          # merged without the native gate having run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only)
          if printf '%s\n' "$changed" | grep -qE '^(mobile/|\.github/workflows/ci\.yml$)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "mobile files changed; running the native build"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "no mobile changes; skipping the native build"
          fi

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: ../scripts/check_release_metadata.sh

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate Expo project
        run: npm run doctor

      - name: Audit high and critical vulnerabilities
        run: npm run audit:high

      - name: Export Android bundle
        run: npm run export:android

      - name: Validate OTA profile configuration
        run: |
          EAS_BUILD_PROFILE=production EXPO_UPDATES_ENABLED=true \
            npx expo config --type public --json > /tmp/vazute-production-config.json
          node -e 'const c=require("/tmp/vazute-production-config.json"); if(c.updates?.enabled !== false) process.exit(1)'
          EAS_BUILD_PROFILE=preview EXPO_UPDATES_ENABLED=true \
            npx expo config --type public --json > /tmp/vazute-preview-config.json
          node -e 'const c=require("/tmp/vazute-preview-config.json"); if(c.updates?.enabled !== true) process.exit(1)'

      - name: Prebuild production native projects
        if: steps.native.outputs.needed == 'true'
        env:
          EAS_BUILD_PROFILE: production
          EXPO_UPDATES_ENABLED: "false"
          EXPO_USE_DEV_CLIENT: "0"
        run: npx expo prebuild --platform all --no-install --clean

      - name: Install Java
        if: steps.native.outputs.needed == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        if: steps.native.outputs.needed == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Validate generated native security config
        if: steps.native.outputs.needed == 'true'
        run: python3 scripts/validate_native_config.py

      - name: Compile Android release
        if: steps.native.outputs.needed == 'true'
        working-directory: mobile/android
        # 30 minutes is generous for this build; a run that exceeds it is stuck,
        # not slow, and should say so rather than sit until GitHub's 6h default.
        timeout-minutes: 30
        env:
          # A hosted runner does not have the memory for parallel Gradle workers
          # alongside React Native's NDK compilation. Serialising keeps the peak
          # down, which is the most likely reason this step hung.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
        run: ./gradlew :app:assembleRelease --no-daemon --no-parallel --stacktrace

      - name: Validate packaged Android release
        if: steps.native.outputs.needed == 'true'
        working-directory: mobile
        run: python3 scripts/validate_native_config.py

      - name: Enable Android emulator acceleration
        if: steps.native.outputs.needed == 'true'
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android release smoke test
        if: steps.native.outputs.needed == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile
          script: scripts/run-android-smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload native smoke diagnostics
        if: always() && steps.native.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-native-smoke
          path: mobile/artifacts/maestro
          if-no-files-found: ignore
          retention-days: 7

  operations:
    name: Operations
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm --volume "$PWD:$PWD:ro" --workdir "$PWD" \
            rhysd/actionlint:1.7.7@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d \
            -color

      - name: ShellCheck operational scripts
        run: |
          docker run --rm --volume "$PWD:$PWD:ro" --workdir "$PWD" \
            koalaman/shellcheck:v0.10.0@sha256:0fa384f2a6171aef8aab2999a531c8c8158727d54a8f20157a5c3c51a734d6b2 \
            --external-sources scripts/*.sh scripts/tests/*.sh bench/*.sh bench/db/*.sh

      - name: Validate embedded Python
        run: |
          python3 scripts/tests/check_embedded_python.py \
            scripts/backup_to_r2.sh scripts/restore_from_r2.sh \
            scripts/tests/deployment_hardening_test.sh \
            scripts/tests/ci_contract_test.sh \
            scripts/tests/edge_security_config_test.sh

      - name: Validate dependency policy
        run: |
          python3 scripts/check_dependency_policy.py
          python3 scripts/tests/dependency_policy_test.py

      - name: Validate CI security and smoke-test contracts
        run: scripts/tests/ci_contract_test.sh

      - name: Backup and restore safety tests
        run: scripts/tests/backup_restore_test.sh

      - name: Release worker metrics tests
        run: scripts/tests/release_schedule_metrics_test.sh

      - name: Validate Alertmanager config permissions
        run: scripts/tests/alertmanager_config_test.sh

      - name: Validate calendar feed log redaction
        run: scripts/tests/calendar_feed_log_safety_test.sh

      - name: Validate edge security contact
        run: scripts/tests/edge_security_config_test.sh

      - name: Validate deployment isolation
        run: scripts/tests/deployment_hardening_test.sh

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --entrypoint promtool \
            prom/prometheus:v3.6.0@sha256:d9a702d3f7f398540e7190c4d80dbb8a0dc95c1e481e8ebd8a08e5bcf83cf735 \
            check rules /repo/ops/prometheus/cinetrack-alerts.yml

  e2e:
    name: Frontend E2E
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e

      - name: PWA install and offline tests
        run: npm run test:e2e:pwa

  e2e-realstack:
    name: Frontend E2E (real stack)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: cinetrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d cinetrack_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (real backend + Postgres)
        run: npm run test:e2e:realstack
        env:
          E2E_DATABASE_URL: postgres://test_user:test_pass@localhost:5432/cinetrack_test

  rust-audit:
    name: Rust Audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Install Rust security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit dependencies
        run: |
          cargo audit
          cargo deny check --hide-inclusion-graph licenses sources bans

  container-security:
    name: Container Security
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build production images
        run: |
          docker build --tag cinetrack-backend:ci --file backend/Dockerfile.prod backend
          docker build --tag cinetrack-frontend:ci --file frontend/Dockerfile.prod frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: cinetrack-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: cinetrack-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Prepare release evidence
        run: mkdir -p artifacts/sbom

      - name: Generate backend CycloneDX SBOM
        run: |
          trivy image \
            --scanners vuln \
            --format cyclonedx \
            --output "${GITHUB_WORKSPACE}/artifacts/sbom/backend.cdx.json" \
            cinetrack-backend:ci

      - name: Generate frontend CycloneDX SBOM
        run: |
          trivy image \
            --scanners vuln \
            --format cyclonedx \
            --output "${GITHUB_WORKSPACE}/artifacts/sbom/frontend.cdx.json" \
            cinetrack-frontend:ci

      - name: Validate release evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          for sbom in artifacts/sbom/backend.cdx.json artifacts/sbom/frontend.cdx.json; do
            if [[ ! -s "$sbom" ]]; then
              echo "::error file=${sbom}::Trivy did not create a non-empty SBOM"
              exit 1
            fi
            jq --exit-status '
              .bomFormat == "CycloneDX" and
              (.specVersion | type == "string") and
              (.components | type == "array" and length > 0)
            ' "$sbom" >/dev/null
          done
          jq --null-input \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg backend_image "$(docker image inspect --format '{{.Id}}' cinetrack-backend:ci)" \
            --arg frontend_image "$(docker image inspect --format '{{.Id}}' cinetrack-frontend:ci)" \
            '{
              source_commit: $source_commit,
              backend_image: $backend_image,
              frontend_image: $frontend_image
            }' > artifacts/sbom/release-images.json
          (
            cd artifacts/sbom
            sha256sum \
              backend.cdx.json \
              frontend.cdx.json \
              release-images.json \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sboms-${{ github.sha }}
          path: artifacts/sbom
          if-no-files-found: error
          retention-days: 30

      - name: Scan deployment configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - integration
      - frontend
      - mobile
      - operations
      - e2e
      - e2e-realstack
      - rust-audit
      - container-security
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq --raw-output '
            to_entries[] |
            select(.value.result != "success") |
            "\(.key)=\(.value.result)"
          ' <<<"$JOB_RESULTS")
          if [ -n "$failures" ]; then
            echo "::error::Required CI jobs did not succeed:"
            printf '%s\n' "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded"
